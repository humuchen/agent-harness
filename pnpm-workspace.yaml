packages:
  - 'frontend/*' # 前端应用层：webapp, cli
  - 'access/*' # 接入层：server
  - 'backend/*' # 后端工具层：core, client, medical-ad-guard
  - 'plugins/*' # 业务插件（非侵入，跨层复用）
  - 'services/*' # 外部集成/底座：rag
  - 'examples'
  - 'mobile'
  - 'mobile/*' # 手机端：Capacitor 原生壳
# pnpm v11：依赖的构建脚本默认全部禁止，需在此显式放行。
# 一旦设置 allowBuilds，任何"带 install 脚本但未被列入"的依赖都会触发
# ERR_PNPM_IGNORED_BUILDS 并直接导致 pnpm install exit 1（部署卡死）。
# - esbuild：webapp 用 Vite 构建依赖其 postinstall 下载原生二进制；
# - protobufjs：backend/core 的 @opentelemetry/* OTLP 导出器传递依赖，
#   用于 protobuf 序列化，带 postinstall 脚本，同样需要放行。
allowBuilds:
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@humuchen/mac-ui@0.0.3'
