# 本地自托管 agent-harness（单实例）。
#   docker compose up --build            # 内存模式（无 Redis，单副本）
#   docker compose --profile redis up    # 带 Redis 运行队列（支持多副本水平扩展）
#
# 镜像从仓库根目录的 Dockerfile 构建（pnpm monorepo 多阶段构建）。

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-harness:local
    ports:
      - '4173:4173'
    environment:
      NODE_ENV: production
      PORT: '4173'
      UI_HOST: '0.0.0.0'
      # 代码执行隔离级别：os=OS 级命名空间/seccomp 隔离（默认，需 Linux+helper）；
      #   container=Docker 容器隔离；local=硬化本地进程（非 Linux 降级）；none=仅逻辑沙箱。
      # shell_exec 任务默认按 resolveIsolationBackend() 抬升到 os，此处覆盖全局基线。
      SANDBOX_BACKEND: '${SANDBOX_BACKEND:-os}'
      # 真实 LLM（留空则用内置 Mock LLM 离线运行）。
      OPEN_API_KEY: '${OPEN_API_KEY:-}'
      OPEN_MODEL: '${OPEN_MODEL:-}'
      # 平台兜底 Key（BYOK 架构）：未自带 Key 的用户回退到此；需 ALLOW_PLATFORM_KEY=true 才生效。
      PLATFORM_OPEN_API_KEY: '${PLATFORM_OPEN_API_KEY:-}'
      ALLOW_PLATFORM_KEY: '${ALLOW_PLATFORM_KEY:-}'
      # 站点 admin 凭证：独立于 LLM 密钥，避免 OPEN_API_KEY 同时充当「LLM 密钥 + admin 凭证」
      #（server.ts 检测到 ADMIN_API_KEY 缺失时会打印双用途告警）。
      # 注意：compose 只把 .env 用于 ${VAR} 替换，不会自动注入容器，故需在此显式声明。
      ADMIN_API_KEY: '${ADMIN_API_KEY:-}'
      # 运行队列：默认内存模式；启用 redis profile 后由下方 REDIS_URL 接管。
      REDIS_URL: '${REDIS_URL:-}'
      # 记忆持久化后端（Phase 4 决策 A）：file 后端落 RWX 风格共享卷 /app/data，
      # 配合下方 data 卷挂载，单实例重启不丢、与 k8s 部署行为一致（sqlite 勿用）。
      MEMORY_BACKEND: 'file'
      MEMORY_DIR: '/app/data/memory'
      # 医美插件（medical-aesthetics-lead）数据库绝对路径：固定落点，避免随启动 cwd 不同分散到 access/server/data 与项目根 data 两处。
      MA_DATA_DIR: '/app/data/ma-lead'
      # 外部 RAG MCP Server（stdio 模式）：从宿主 .env 注入，子进程继承 RAG_* 顶层 env。
      # 内置默认清单（未设宿主 MCP_SERVERS 时生效）：rag / context7 / filesystem / fetch / memory / excel。
      MCP_SERVERS: '${MCP_SERVERS:-[{"name":"rag","command":"node","args":["services/rag/dist/index.js"]},{"name":"context7","serverUrl":"https://mcp.context7.com/mcp"},{"name":"filesystem","command":"node","args":["access/server/node_modules/@modelcontextprotocol/server-filesystem/dist/cjs/index.js","."]},{"name":"fetch","command":"node","args":["access/server/node_modules/@tokenizin/mcp-npx-fetch/dist/index.js"]},{"name":"memory","command":"node","args":["access/server/node_modules/@modelcontextprotocol/server-memory/dist/cjs/index.js"]},{"name":"excel","command":"node","args":["access/server/node_modules/@negokaz/excel-mcp-server/dist/launcher.js"],"env":{"EXCEL_MCP_PAGING_CELLS_LIMIT":"4000"}}]}'
      RAG_TRANSPORT: '${RAG_TRANSPORT:-mcp}'
      RAG_TENANT_ID: '${RAG_TENANT_ID:-default}'
      RAG_DATA_FILE: '${RAG_DATA_FILE:-data/rag-store.json}'
      # ── 启动强校验（P2）：AH_STARTUP_CRITICAL=1 时关键配置校验失败直接阻断启动
      AH_STARTUP_CRITICAL: '1'
      # 账户 token 签名密钥：缺失则 getAuthSecret() 每进程随机生成，签发/验证密钥不一致 → 登录态全部失效。
      # 必须透传 .env 的 AH_CRYPTO_KEY（或单独的 AH_AUTH_SECRET）到容器。
      AH_CRYPTO_KEY: '${AH_CRYPTO_KEY:-}'
      AH_AUTH_SECRET: '${AH_AUTH_SECRET:-}'
      # ── 成本硬上限（P2 Go-live）：每窗口最大成本（美元），0=不限
      MAX_COST_PER_WINDOW: '10'
      # ── 告警路由（P2）：ALERT_WEBHOOK_URL 推送至 Slack/飞书/钉钉入站 Webhook
      ALERT_WEBHOOK_URL: '${ALERT_WEBHOOK_URL:-}'
      ALERT_LOG_PATH: '/app/data/alerts.jsonl'
      # ── 日志脱敏（P2）：全局 scrubber 激活开关
      LOG_SCRUB_ENABLED: 'true'
      # ── 指标持久化（P2）：跨重启保留累计计数 / token / 成本 / 租户维度
      TELEMETRY_FILE: '/app/data/telemetry-metrics.json'
      # Go-live：备份与恢复配置
      AH_BACKUP_DIR: '/var/lib/agent-harness/backups'
      AH_BACKUP_KEEP_DAYS: '30'
      # ── 生产模式切换（开发模式默认关闭） ────────────────────────────
      # 生产部署建议使用 docker-compose.prod.yml 覆盖以下变量：
      #   REQUIRE_TENANT=on              # P0.3 租户隔离强制门禁
      #   AH_MIGRATE_AUTO=on             # P0-D 启动时自动数据库迁移
      #   RUN_QUEUE_BACKEND=redis        # 多副本共享运行队列
      #   AGENT_STORE=redis              # 多副本共享 AgentRegistry
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4173/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # 共享记忆卷：ui 容器把记忆与插件数据写入 /app/data（file 后端），重启不丢。
      - data:/app/data
      # 临时绕过：运行时镜像漏带 services/（Dockerfile 已补 COPY，待下次成功 rebuild 后可移除本挂载）。
      # rag 服务依赖为空（纯 stdlib），宿主已构建的 dist 直接挂入即可启用内置 RAG MCP。
      - ./services/rag:/app/services/rag:ro

  # 可选：运行队列后端（多副本共享队列 / 跨实例事件桥）。
  # 启用：docker compose --profile redis up
  redis:
    image: redis:7-alpine
    profiles: ['redis']
    restart: unless-stopped
    # 开启 AOF 持久化：队列 / 事件桥数据写入 redis-data 卷，Redis 重启或重建后不丢。
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  data:
