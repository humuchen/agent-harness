}
const icon = (p) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="' + p + '"/></svg>';
const iconOf = (n) => ICONS[n] || ICON_TERMINAL;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const host = document.getElementById('suggestions');
const ta = document.getElementById('ta');
const stateText = document.getElementById('stateText');

function render() {
  const list = candidates();
  const panelOpen = isCommandInput() && !state.dismissed;
  let html = '';
  if (state.selected) {
    const cmd = COMMANDS.find((c) => c.name === state.selected);
    const desc = cmd ? cmd.description : '';
    html += '<div class="chip-bar" role="group" aria-label="已选命令">' +
      '<span class="chip" title="/' + esc(state.selected) + (desc ? ' — ' + esc(desc) : '') + '">' +
      icon(iconOf(state.selected)) +
      '<span class="chip-name">/' + esc(state.selected) + '</span>' +
      '<button type="button" class="chip-x" aria-label="移除命令 /' + esc(state.selected) + '" title="移除命令" data-remove="1">×</button>' +
      '</span><span class="chip-hint">' + esc(desc) + '</span></div>';
  }
  if (panelOpen) {
    html += '<div class="panel" role="listbox" aria-label="可用命令">' +
      '<div class="panel-head">' + icon(ICON_TERMINAL) +
      '<span class="panel-title">命令' + (list.length ? ' · ' + list.length : '') + '</span>' +
      '<span class="panel-keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>⏎</kbd><kbd>Esc</kbd></span></div>';
    if (!list.length) {
      html += '<div class="empty">' + icon('M11 20a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM21 21l-4.35-4.35') +
        '<span class="empty-text">无匹配命令</span>' +
        '<span class="empty-hint"><kbd>Esc</kbd> 关闭，或继续输入以搜索</span></div>';
    } else {
      let idx = 0;
      for (const g of groupCommands(list)) {
        html += '<div class="group" role="group" aria-label="' + g.label + '"><div class="group-label">' + g.label + '</div>';
        for (const c of g.items) {
          const i = idx++;
          html += '<button type="button" class="cmd-item' + (i === state.active ? ' active' : '') +
            '" role="option" aria-selected="' + (i === state.active) + '" data-index="' + i + '" title="' + esc(c.description) + '">' +
            icon(iconOf(c.name)) +
            '<span class="cmd-body"><span class="cmd-name">/' + esc(c.name) + '</span>' +
            '<span class="cmd-desc">' + esc(c.description) + '</span></span>' +
            (c.aliases.length ? '<span class="cmd-alias">' + esc(c.aliases.join(', ')) + '</span>' : '') +
            '</button>';
        }
        html += '</div>';
      }
    }
    html += '<div class="panel-foot">' + (list.length
      ? '<kbd>⏎</kbd> 选中命令，随后输入参数'
      : '<kbd>Esc</kbd> 关闭面板') + '</div></div>';
  }
  host.innerHTML = html;
  ta.placeholder = state.selected
    ? '已选命令 /' + state.selected + '，输入参数后 ⏎ 执行（× 或 Backspace 移除）'
    : "您正在与 Agent 聊天，输入'/'获取更多能力，如'/plan'，'⇧⏎'换行";
  stateText.textContent = state.selected
    ? '发送内容：/' + state.selected + (state.value.trim() ? ' ' + state.value.trim() : '')
    : '';
}

function select(name) {
  state.selected = name;
  state.value = '';
  state.dismissed = true;
  ta.value = '';
  autoHeight();
  render();
  ta.focus();
}
function remove() {
  state.selected = '';
  render();
  ta.focus();
}
function autoHeight() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; }

ta.addEventListener('input', () => {
  state.value = ta.value;
  if (!isCommandInput()) state.dismissed = false;
  state.active = query() ? 0 : -1;
  autoHeight();
  render();
});
ta.addEventListener('keydown', (e) => {
  const list = candidates();
  const open = isCommandInput() && !state.dismissed;
  if (!open) {
    if (e.key === 'Backspace' && state.selected && !state.value) { e.preventDefault(); remove(); }
    return;
  }
  const total = list.length;
  switch (e.key) {
    case 'ArrowDown': e.preventDefault(); state.active = total ? (state.active + 1) % total : 0; render(); break;
    case 'ArrowUp': e.preventDefault(); state.active = total ? (state.active <= 0 ? total - 1 : state.active - 1) : 0; render(); break;
    case 'Enter':
    case 'Tab': {
      const cmd = list[state.active];
      if (!cmd) return;
      e.preventDefault(); select(cmd.name); break;
    }
    case 'Escape': e.preventDefault(); state.dismissed = true; render(); break;
  }
});
host.addEventListener('click', (e) => {
  if (e.target.dataset.remove) { remove(); return; }
  const item = e.target.closest('.cmd-item');
  if (item) select(candidates()[Number(item.dataset.index)].name);
});
host.addEventListener('mouseover', (e) => {
  const item = e.target.closest('.cmd-item');
  if (!item) return;
  const i = Number(item.dataset.index);
  if (i !== state.active) { state.active = i; render(); }
});
document.addEventListener('pointerdown', (e) => {
  if (!(isCommandInput() && !state.dismissed)) return;
  if (host.contains(e.target) || e.target === ta) return;
  state.dismissed = true;
  render();
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
render();
ta.focus();
</script>
</body>
</html>
