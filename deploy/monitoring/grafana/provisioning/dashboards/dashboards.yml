apiVersion: 1

# Grafana 看板自动装配：扫描 /var/lib/grafana/dashboards 下的 JSON 并加载。
providers:
  - name: agent-harness
    orgId: 1
    folder: 'Agent Harness'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
