# 本地访问：ClusterIP → NodePort，固定 31473（30000-32767 范围内）。
# Docker Desktop / kind / minikube 下均可通过 localhost:31473 访问。
apiVersion: v1
kind: Service
metadata:
  name: agent-harness
  namespace: agent-harness
spec:
  type: NodePort
  ports:
    - name: http
      port: 4173
      targetPort: http
      nodePort: 31473
