# External Secrets Operator 部署配置（可选）
#
# 适用场景：生产环境从 Vault / AWS Secrets Manager / GCP Secret Manager
# 同步密钥到 K8s Secret，避免明文存储在 git 仓库中。
#
# 部署步骤：
# 1. 安装 External Secrets Operator：
#    kubectl apply -f https://raw.githubusercontent.com/external-secrets/external-secrets/main/bundle.yaml
# 2. 创建 SecretStore 或 ClusterSecretStore（按需选择）
# 3. 应用本文件中的 ExternalSecret 资源
#
# 注意：本文件默认不启用（不自动 apply），需按需开启。
---
# 示例：AWS Secrets Manager 后端（生产推荐）
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: agent-harness-secrets
# spec:
#   provider:
#     aws:
#       service: SecretsManager
#       region: us-east-1
#       auth:
#         jwt:
#           serviceAccountRef:
#             name: external-secrets-sa
#             namespace: agent-harness
---
# 示例：ExternalSecret 资源（从 SecretStore 同步到 K8s Secret）
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: agent-harness
#   namespace: agent-harness
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: agent-harness-secrets
#     kind: ClusterSecretStore
#   target:
#     name: agent-harness
#     creationPolicy: Owner
#   data:
#     - secretKey: ADMIN_API_KEY
#       remoteRef:
#         key: agent-harness/prod
#         property: ADMIN_API_KEY
#     - secretKey: OPEN_API_KEY
#       remoteRef:
#         key: agent-harness/prod
#         property: OPEN_API_KEY
#     - secretKey: REDIS_PASSWORD
#       remoteRef:
#         key: agent-harness/prod
#         property: REDIS_PASSWORD
#     - secretKey: SECRETS_FILE
#       remoteRef:
#         key: agent-harness/prod
#         property: SECRETS_FILE  # 指向外部 JSON 文件路径
