# agent-harness 告警规则
#
# 供 Prometheus Alertmanager 使用。
# 部署方式：
#   kubectl apply -f deploy/k8s/overlays/prod/alerts.yaml
#
# 阈值说明：
#   - memory: RSS 超过 90% 容器 limits 持续 2 分钟
#   - queue_depth: pending 队列超过 30 持续 5 分钟
#   - run_failure_rate: Run 失败率超过 30% 持续 10 分钟（分母下限 0.05 rps 防低流量误报）
#   - processing_stuck: 有任务在执行但 30 分钟无任何完成/失败事件（疑似挂死）
#
# 指标来源：/api/metrics/prometheus 导出的 harness_* 系列（见 metrics-routes.ts）。
# 历史注记：本文件曾引用 llm_call_errors_total / llm_call_attempts_total /
# harness_job_started_seconds —— 这三个指标从未被导出，对应告警从未触发过（幽灵指标）。

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-harness-alerts
  namespace: agent-harness
  labels:
    app.kubernetes.io/name: agent-harness
    app.kubernetes.io/part-of: agent-harness
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: agent-harness
      rules:
        # 1. 内存使用过高
        - alert: HarnessMemoryHigh
          expr: |
            (process_resident_memory_bytes / 1024 / 1024)
            > (kube_deployment_spec_replicas * 1024)
          for: 2m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "agent-harness 内存使用过高"
            description: "Pod {{ $labels.pod }} 内存使用 {{ $value | humanize1024 }}MB，超过阈值 1GB。可能内存泄漏。"
            runbook_url: "https://wiki.example.com/runbooks/harness-memory"

        # 2. 队列深度过高
        - alert: HarnessQueueDepthHigh
          expr: harness_queue_pending > 30
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "agent-harness 队列深度过高"
            description: "队列等待任务数 {{ $value }}，超过阈值 30。可能需要扩容或排查慢任务。"
            runbook_url: "https://wiki.example.com/runbooks/harness-queue"

        # 3. Run 失败率过高（LLM 调用失败 / 护栏 / 执行异常最终都体现为 run 失败）
        - alert: HarnessRunFailureRateHigh
          expr: |
            sum(rate(harness_run_failed_total[5m]))
              /
            clamp_min(sum(rate(harness_run_success_total[5m])) + sum(rate(harness_run_failed_total[5m])), 0.05)
            > 0.3
          for: 10m
          labels:
            severity: critical
            team: llm
          annotations:
            summary: "agent-harness Run 失败率过高"
            description: "Run 失败率 {{ $value | humanizePercentage }}，超过阈值 30%（分母下限 0.05 rps，低流量不误报）。检查熔断器状态与模型端点。"
            runbook_url: "https://wiki.example.com/runbooks/harness-llm"

        # 4. 任务滞留 processing 疑似挂死
        - alert: HarnessProcessingStuck
          expr: |
            max_over_time(harness_queue_processing[30m]) > 0
            and (sum(increase(harness_run_success_total[30m])) + sum(increase(harness_run_failed_total[30m]))) == 0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "agent-harness 任务滞留 processing 疑似挂死"
            description: "30 分钟内有任务处于 processing 但无任何完成/失败事件。检查看门狗与 job 日志。"
            runbook_url: "https://wiki.example.com/runbooks/harness-job"

        # 5. 健康检查失败
        - alert: HarnessReadinessProbeFailed
          expr: up{job="agent-harness"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "agent-harness 实例不可用"
            description: "Pod {{ $labels.pod }} 健康检查失败，可能被 K8s 重启。"
