# R7 可观测性接入：注入 OTLP 环境变量，让 agent-harness 把 traces/metrics
# 发往 harness-env-platform 的 OpenTelemetry Collector。
#
# 端点说明：Collector 由 env-platform/observability/otel-collector.yaml 部署，
# 默认命名空间 observability、Service 名 otel-collector。若你的部署用了别的
# 命名空间/Service 名，请改下方 endpoint。端点不可达时 OTel SDK 静默丢弃，
# 不影响业务进程。
#
# ⚠️ 端口/协议必须与 core 的导出器实现匹配：@agent-harness/core 使用
#    OTLP **HTTP/protobuf** 导出器（exporter-*-otlp-http），对应 Collector 的
#    HTTP 端口 **4318**。此前写 :4317 + grpc 与实现不符，数据会静默丢失。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-harness
  namespace: agent-harness
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "agent-harness"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=agent-harness,deployment.environment=eks"
