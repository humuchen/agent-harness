# R4 服务端 RAG 接线（EKS 专属）：把 RAG 服务地址注入 agent-harness 的环境变量，
# 让 medical-aesthetics-lead 插件的 project_kb_search 走到 services/rag（RWX 上的 rag 服务），
# 而非回退到空本地库。
#
# 仅 EKS 注入：base 不写 MA_RAG_BASE_URL，保证本地/非 EKS 环境保持 fail-closed（不连 RAG）。
# 令牌走 Secret（MA_RAG_TOKEN，见 secret.yaml.example，须与 RAG_API_TOKEN 相同），
# 经 deployment.yaml 的 secretRef 自动进入 Pod 环境。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-harness
  namespace: agent-harness
data:
  MA_RAG_BASE_URL: "http://rag:8787"
