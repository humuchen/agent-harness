# Ingress 模板。把 host 改为你的真实域名，并按集群 Ingress Controller 调整
# ingressClassName / TLS 配置（示例使用 cert-manager 的 cluster-issuer）。
#
# 注意：本集群未安装 cert-manager，故不启用 tls 自动签发；源站走 HTTP(80)，
# TLS 由前置的 Cloudflare 边缘（Flexible SSL）终结。如需源站 HTTPS，请安装
# cert-manager 并配置 cluster-issuer 后恢复下方 tls 段。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-harness
  namespace: agent-harness
  labels:
    app.kubernetes.io/part-of: agent-harness
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"        # 源站不强制跳 HTTPS（Cloudflare 负责边缘 TLS）
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE 流需长超时
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: yanghu8.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-harness
                port:
                  name: http
