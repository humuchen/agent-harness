# agent-harness K8s 基础清单（kustomize）。
#
# 应用全部（含可选 Redis）：
#   kubectl apply -k deploy/k8s
#
# 不含 Redis（内存模式单/多副本，无跨实例队列）：
#   kubectl apply -f namespace.yaml -f configmap.yaml -f secret.yaml.example \
#     -f deployment.yaml -f service.yaml -f ingress.yaml -f hpa.yaml
#
# ⚠️ 部署前必须：
#   1. secret.yaml 已移出 git（含真实凭据永不提交）。基于 secret.yaml.example
#      在本地创建 secret.yaml（gitignore 已忽略它），或用 kubectl create secret
#      直接注入真实密钥（建议 Sealed/External Secrets）；
#   2. 把 deployment.yaml 的 image 改为你的实际镜像与 tag；
#   3. 把 ingress.yaml 的 host 改为你的域名，并确认集群有对应 Ingress Controller / TLS。
#
# 本地快速验证（用已构建的 agent-harness:local 镜像 + NodePort）：
#   kubectl apply -k deploy/k8s/overlays/local
#   kubectl -n agent-harness get pods -w
#   浏览器打开 http://localhost:31473  （或 kubectl -n agent-harness port-forward svc/agent-harness 4173:4173）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-harness
commonLabels:
  app.kubernetes.io/part-of: agent-harness

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml.example
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - redis.yaml   # Redis 已默认启用，运行队列走 redis://redis:6379（见 Secret）
  - pvc.yaml     # 记忆持久化共享卷（RWX，多副本共享 /app/data）
