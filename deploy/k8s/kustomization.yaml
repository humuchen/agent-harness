# agent-harness K8s 基础清单（kustomize）。
#
# 应用全部（含可选 Redis）：
#   kubectl apply -k deploy/k8s
#
# 不含 Redis（内存模式单/多副本，无跨实例队列）：
#   kubectl apply -f namespace.yaml -f configmap.yaml -f secret.yaml \
#     -f deployment.yaml -f service.yaml -f ingress.yaml -f hpa.yaml
#
# ⚠️ 部署前必须：
#   1. 把 secret.yaml 的占位值替换为真实密钥（建议改用 Sealed/External Secrets）；
#   2. 把 deployment.yaml 的 image 改为你的实际镜像与 tag；
#   3. 把 ingress.yaml 的 host 改为你的域名，并确认集群有对应 Ingress Controller / TLS。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-harness
commonLabels:
  app.kubernetes.io/part-of: agent-harness

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  # 可选：取消注释以启用内置 Redis（生产建议用托管 Redis）。
  # - redis.yaml
