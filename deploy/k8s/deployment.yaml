apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-harness
  namespace: agent-harness
  labels:
    app.kubernetes.io/name: agent-harness
    app.kubernetes.io/part-of: agent-harness
spec:
  # 生产建议 >=2 副本（配合 REDIS_URL 运行队列实现水平扩展）。
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-harness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-harness
        app.kubernetes.io/part-of: agent-harness
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/<your-org>/agent-harness:latest   # 替换为实际镜像与 tag（建议按 digest 固定）
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4173
          envFrom:
            - configMapRef:
                name: agent-harness
            - secretRef:
                name: agent-harness
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # 健康检查：服务端 /api/v1/state（Render 亦用此路径）。
          readinessProbe:
            httpGet:
              path: /api/v1/state
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/state
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # server 需要写 /tmp 与内存持久化目录
            capabilities:
              drop: ["ALL"]
