# 敏感配置。请勿把真实密钥提交进仓库。
#
# 生产建议：用 Sealed Secrets / External Secrets Operator / CSI 驱动注入，
# 而非把 Secret 直接落库。下方为占位模板，部署前用真实值覆盖：
#
#   kubectl -n agent-harness create secret generic agent-harness \
#     --from-literal=UI_AUTH_TOKEN='<强随机>' \
#     --from-literal=OPENROUTER_API_KEY='sk-or-...' \
#     --from-literal=REDIS_URL='redis://:PASSWORD@redis:6379' \
#     --from-literal=HARNESS_API_KEY='' \
#     --from-literal=HARNESS_ACCOUNT_ID='' \
#     --from-literal=HARNESS_ORG_ID='' \
#     --from-literal=HARNESS_PROJECT_ID=''
#
# 占位值仅为让 kubectl apply 通过；运行前务必替换，否则服务将开放 / 无 LLM。
apiVersion: v1
kind: Secret
metadata:
  name: agent-harness
  namespace: agent-harness
  labels:
    app.kubernetes.io/part-of: agent-harness
type: Opaque
stringData:
  UI_AUTH_TOKEN: "CHANGE-ME-USE-SEALED-SECRET-IN-PROD"
  OPENROUTER_API_KEY: ""
  OPENROUTER_MODEL: "openai/gpt-4o-mini"
  REDIS_URL: ""
  HARNESS_API_KEY: ""
  HARNESS_ACCOUNT_ID: ""
  HARNESS_ORG_ID: ""
  HARNESS_PROJECT_ID: ""
