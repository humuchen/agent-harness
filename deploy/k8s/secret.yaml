# 敏感配置。请勿把真实密钥提交进仓库。
#
# 生产建议：用 Sealed Secrets / External Secrets Operator / CSI 驱动注入，
# 而非把 Secret 直接落库。下方为占位模板，部署前用真实值覆盖：
#
#   kubectl -n agent-harness create secret generic agent-harness \
#     --from-literal=UI_AUTH_TOKEN='<强随机>' \
#     --from-literal=OPENROUTER_API_KEY='sk-or-...' \
#     --from-literal=REDIS_URL='redis://:PASSWORD@redis:6379' \
#     --from-literal=HARNESS_API_KEY='' \
#     --from-literal=HARNESS_ACCOUNT_ID='' \
#     --from-literal=HARNESS_ORG_ID='' \
#     --from-literal=HARNESS_PROJECT_ID=''
#
# 占位值仅为让 kubectl apply 通过；运行前务必替换，否则服务将开放 / 无 LLM。
apiVersion: v1
kind: Secret
metadata:
  name: agent-harness
  namespace: agent-harness
  labels:
    app.kubernetes.io/part-of: agent-harness
type: Opaque
stringData:
  # 默认开放（UI_AUTH_TOKEN 为空 = 不要求鉴权），本地/快速验证可用。
  # 生产请改为强随机值（见 kustomization 顶部 create secret 命令）。
  UI_AUTH_TOKEN: "Sn8HpPWEc0mMgt9k_YdXRCbSQoURbnz5Eqpum0Ed854"  # 已生成强随机值（私有仓库可直接用；共享仓库建议改 kubectl/Sealed Secrets 注入）
  OPENROUTER_API_KEY: ""  # 安全：真实 key 已从文件移除（勿把外部凭据提交进 git）。部署前用 kubectl create secret 注入；若曾 push 请立即到 OpenRouter 后台轮换。
  OPENROUTER_MODEL: "agnes-2.5-flash"
  # Redis 已默认启用（kustomization 含 redis.yaml）。生产必须带密码：
  # 把下方 REDIS_PASSWORD 与这里改成同一强随机值（或用 kubectl create secret 注入）。
  REDIS_URL: "redis://:gDALI859kHCjOBT4MnE1vPq0GYKMZFKf@redis:6379"
  REDIS_PASSWORD: "gDALI859kHCjOBT4MnE1vPq0GYKMZFKf"
  HARNESS_API_KEY: ""
  HARNESS_ACCOUNT_ID: ""
  HARNESS_ORG_ID: ""
  HARNESS_PROJECT_ID: ""
