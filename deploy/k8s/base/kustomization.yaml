# agent-harness K8s 基础清单（kustomize base）。
#
# 应用全部（含可选 Redis）：
#   kubectl apply -k deploy/k8s            # 根 kustomization 代理到本 base
#   （等价于 kubectl apply -k deploy/k8s/base）
#
# 不含 Redis（内存模式单/多副本，无跨实例队列）：
#   kubectl apply -f namespace.yaml -f configmap.yaml -f secret.yaml.example \
#     -f deployment.yaml -f service.yaml -f ingress.yaml -f hpa.yaml
#
# ⚠️ 部署前必须：
#   1. secret.yaml 已移出 git（含真实凭据永不提交）。基于 secret.yaml.example
#      在本地创建 secret.yaml（gitignore 已忽略它），或用 kubectl create secret
#      直接注入真实密钥（建议 Sealed/External Secrets）；
#   2. 把 deployment.yaml 的 image 改为你的实际镜像与 tag；
#   3. 把 ingress.yaml 的 host 改为你的域名，并确认集群有对应 Ingress Controller / TLS。
#
# EKS 专属加固（Plan A 的 app-ready 层就绪后）：
#   kubectl apply -k deploy/k8s/overlays/eks
#   该 overlay 叠加 Let's Encrypt 证书、imagePullSecrets(regcred)、OTel 环境变量、
#   FinOps 标签、可选出网 NetworkPolicy。详见 overlays/eks/kustomization.yaml。
#
# 可选 RAG 服务（services/rag）：
#   kubectl -n agent-harness apply -f ../rag.yaml
#   （需先在 secret.yaml 设 RAG_API_TOKEN，并构建推送 rag 镜像）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-harness
commonLabels:
  app.kubernetes.io/part-of: agent-harness

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml.example
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - redis.yaml   # Redis 已默认启用，运行队列走 redis://redis:6379（见 Secret）
  - pvc.yaml     # 记忆持久化共享卷（RWX，多副本共享 /app/data）
