# 记忆持久化共享卷（决策 A：多副本共享）。
#
# 所有 ui 副本把此卷挂载到 /app/data，配合 configmap 的
#   MEMORY_BACKEND=file + MEMORY_DIR=/app/data/memory
# 实现：记忆跨副本一致、pod 重启/重建不丢。
#
# ⚠️ 关键：accessModes 必须是 ReadWriteMany（多 pod 同时读写同一份文件）。
#    集群默认 StorageClass 通常只支持 RWO（如 AWS EBS / 阿里云云盘），会导致 PVC 一直 Pending。
#    请用支持 RWX 的 StorageClass（在下方 storageClassName 填写）：
#      AWS EFS        -> efs.csi.aws.com           （SC 名如 efs-sc）
#      Azure Files    -> azurefile.csi.azure.com   （SC 名如 azurefile）
#      GCP Filestore  -> filestore.csi.storage.gke.io（SC 名如 standard-rwx）
#      ACK/阿里云      -> 使用 NAS 的 alibaba-cloud-nas-csi-driver（SC 名如 alicloud-nas）
#    若留空，则使用集群默认 SC（需其本身支持 RWX）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-harness-data
  namespace: agent-harness
  labels:
    app.kubernetes.io/part-of: agent-harness
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  # 由 harness-env-platform 的 app-ready 层提供（EFS CSI driver + efs-sc StorageClass，RWX）。
  # Plan A 的 module.app_ready 已安装此 StorageClass，PVC 不会再 Pending。
  storageClassName: efs-sc
