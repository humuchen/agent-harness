# 可选：运行队列后端（Redis）。生产建议使用托管的 Redis
# （AWS ElastiCache / GCP Memorystore / Azure Cache），而非此单副本 Deployment。
#
# 启用：kubectl -n agent-harness apply -f redis.yaml
# 并部署时把 Secret 的 REDIS_URL 设为：redis://redis:6379
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: agent-harness
  labels:
    app.kubernetes.io/part-of: agent-harness
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agent-harness
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: agent-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: agent-harness
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agent-harness
  labels:
    app.kubernetes.io/part-of: agent-harness
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
