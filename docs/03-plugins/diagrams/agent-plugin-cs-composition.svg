<svg viewBox="0 0 680 560" width="100%" role="img">
<title>智能客服插件模块构成与接入映射</title>
<desc>plugins/customer-service 各模块分别经 ctx 公共 API 接入 core/server/webapp 扩展点，不侵入业务代码</desc>
<defs>
<marker id="lc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="28" fill="#e8eaf2" font-size="14" font-weight="500">智能客服插件模块构成与接入映射</text>

<text x="40" y="52" fill="#9fb0d0" font-size="13" font-weight="500">plugins/customer-service/</text>
<g><rect x="40" y="64" width="250" height="40" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="56" y="88" fill="#e8eaf2" font-size="13" dominant-baseline="central">manifest.json（能力声明）</text></g>
<g><rect x="40" y="116" width="250" height="40" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="56" y="140" fill="#e8eaf2" font-size="13" dominant-baseline="central">prompts/ 4 AgentCard</text></g>
<g><rect x="40" y="168" width="250" height="40" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="56" y="192" fill="#e8eaf2" font-size="13" dominant-baseline="central">tools/ search_faq·lookup·handoff</text></g>
<g><rect x="40" y="220" width="250" height="40" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="56" y="244" fill="#e8eaf2" font-size="13" dominant-baseline="central">workflows/ cs-conversation FSM</text></g>
<g><rect x="40" y="272" width="250" height="40" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="56" y="296" fill="#e8eaf2" font-size="13" dominant-baseline="central">server/ routes（stats/handoffs）</text></g>
<g><rect x="40" y="324" width="250" height="40" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="56" y="348" fill="#e8eaf2" font-size="13" dominant-baseline="central">web/ ah-cs-admin 面板</text></g>

<text x="400" y="52" fill="#9fb0d0" font-size="13" font-weight="500">基座扩展点（不修改业务代码）</text>
<g><rect x="400" y="116" width="240" height="40" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="416" y="140" fill="#e8eaf2" font-size="13" dominant-baseline="central">AgentRegistry（core）</text></g>
<g><rect x="400" y="168" width="240" height="40" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="416" y="192" fill="#e8eaf2" font-size="13" dominant-baseline="central">ToolRegistry（core）</text></g>
<g><rect x="400" y="220" width="240" height="40" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="416" y="244" fill="#e8eaf2" font-size="13" dominant-baseline="central">Router / Workflow（core）</text></g>
<g><rect x="400" y="272" width="240" height="40" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="416" y="296" fill="#e8eaf2" font-size="13" dominant-baseline="central">ServerExtension（server）</text></g>
<g><rect x="400" y="324" width="240" height="40" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="416" y="348" fill="#e8eaf2" font-size="13" dominant-baseline="central">WebExtension（webapp）</text></g>

<line x1="290" y1="140" x2="400" y2="140" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#lc)"/>
<line x1="290" y1="192" x2="400" y2="192" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#lc)"/>
<line x1="290" y1="244" x2="400" y2="244" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#lc)"/>
<line x1="290" y1="296" x2="400" y2="296" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#lc)"/>
<line x1="290" y1="348" x2="400" y2="348" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#lc)"/>

<rect x="40" y="400" width="600" height="120" rx="10" fill="#232838" stroke="#353c52" stroke-width="0.5"/>
<text x="60" y="428" fill="#e8eaf2" font-size="13" font-weight="500">接入路径（全部经 ctx 公共 API）</text>
<text x="60" y="454" fill="#c8d0e0" font-size="12">prompts → ctx.agentRegistry.register(card)         tools → ctx.tools.register('search_faq', …)</text>
<text x="60" y="478" fill="#c8d0e0" font-size="12">workflows → ctx.workflow.register(def)            server → ctx.server.route('GET','/api/cs/stats', …)</text>
<text x="60" y="502" fill="#c8d0e0" font-size="12">web → ctx.web.registerTab({id:'cs-admin', role:'cs:admin', render})</text>
</svg>