<svg viewBox="0 0 680 600" width="100%" role="img">
<title>插件化架构边界图</title>
<desc>四层边界：Business Plugin（仅含业务）经 Server/Webapp 适配层扩展点接入 Core 平台原语，Core 零业务耦合</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="40" width="600" height="120" rx="10" fill="#2a2e3e" stroke="#3a4055" stroke-width="0.5"/>
<text x="60" y="64" fill="#e8eaf2" font-size="14" font-weight="500">Business Plugin 包（外置 · 仅此处含业务语义）</text>
<g><rect x="56" y="80" width="140" height="64" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="126" y="104" fill="#e8eaf2" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">AgentCard</text>
<text x="126" y="122" fill="#9aa6c2" font-size="12" text-anchor="middle" dominant-baseline="central">+ Prompt 策略</text></g>
<g><rect x="208" y="80" width="140" height="64" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="278" y="104" fill="#e8eaf2" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">FAQ·订单·转人工</text>
<text x="278" y="122" fill="#9aa6c2" font-size="12" text-anchor="middle" dominant-baseline="central">工具</text></g>
<g><rect x="360" y="80" width="140" height="64" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="430" y="104" fill="#e8eaf2" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">server 路由</text>
<text x="430" y="122" fill="#9aa6c2" font-size="12" text-anchor="middle" dominant-baseline="central">stats/handoffs</text></g>
<g><rect x="512" y="80" width="96" height="64" rx="8" fill="#2f3d5c" stroke="#5b8def" stroke-width="1"/>
<text x="560" y="104" fill="#e8eaf2" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">web 面板</text>
<text x="560" y="122" fill="#9aa6c2" font-size="12" text-anchor="middle" dominant-baseline="central">ah-cs-admin</text></g>

<rect x="40" y="180" width="290" height="130" rx="10" fill="#232838" stroke="#353c52" stroke-width="0.5"/>
<text x="56" y="202" fill="#9fb0d0" font-size="13" font-weight="500">Server 适配层（薄 · 业务无关）</text>
<text x="56" y="226" fill="#c8d0e0" font-size="12">· pluginBootstrap 扫描 plugins/</text>
<text x="56" y="246" fill="#c8d0e0" font-size="12">· server.ext 路由挂载</text>
<text x="56" y="266" fill="#c8d0e0" font-size="12">· ctx 装配（registries+config+events）</text>
<text x="56" y="286" fill="#c8d0e0" font-size="12">· RBAC 动作 · SSE 通道</text>

<rect x="350" y="180" width="290" height="130" rx="10" fill="#232838" stroke="#353c52" stroke-width="0.5"/>
<text x="366" y="202" fill="#9fb0d0" font-size="13" font-weight="500">Webapp 适配层（薄 · 业务无关）</text>
<text x="366" y="226" fill="#c8d0e0" font-size="12">· PluginUIRegistry</text>
<text x="366" y="246" fill="#c8d0e0" font-size="12">· registerTab / registerPanel</text>
<text x="366" y="266" fill="#c8d0e0" font-size="12">· 角色门控（cs:admin）</text>
<text x="366" y="286" fill="#c8d0e0" font-size="12">· 从注册表动态渲染</text>

<rect x="40" y="330" width="600" height="230" rx="10" fill="#1f2330" stroke="#353c52" stroke-width="0.5"/>
<text x="60" y="354" fill="#9fb0d0" font-size="13" font-weight="500">Core 平台原语（稳定 · 零业务耦合）</text>
<g><rect x="46" y="372" width="110" height="170" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="101" y="392" fill="#e8eaf2" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">执行与记忆</text>
<text x="101" y="416" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">harness.run</text>
<text x="101" y="434" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">Memory</text>
<text x="101" y="452" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">MemoryStore</text></g>
<g><rect x="166" y="372" width="110" height="170" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="221" y="392" fill="#e8eaf2" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">能力注册</text>
<text x="221" y="416" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">ToolRegistry</text>
<text x="221" y="434" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">AgentRegistry</text>
<text x="221" y="452" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">A2A</text></g>
<g><rect x="286" y="372" width="110" height="170" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="341" y="392" fill="#e8eaf2" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">路由编排</text>
<text x="341" y="416" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">Intent/Task</text>
<text x="341" y="434" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">Router</text>
<text x="341" y="452" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">DagEngine</text></g>
<g><rect x="406" y="372" width="110" height="170" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="461" y="392" fill="#e8eaf2" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">插件基建</text>
<text x="461" y="416" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">PluginLoader</text>
<text x="461" y="434" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">Manifest</text>
<text x="461" y="452" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">RegistryClient</text></g>
<g><rect x="526" y="372" width="104" height="170" rx="8" fill="#313a52" stroke="#4f5d82" stroke-width="0.5"/>
<text x="578" y="392" fill="#e8eaf2" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">横切</text>
<text x="578" y="416" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">EventBus</text>
<text x="578" y="434" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">Guardrails</text>
<text x="578" y="452" fill="#9aa6c2" font-size="11" text-anchor="middle" dominant-baseline="central">Sandbox</text></g>

<line x1="190" y1="160" x2="190" y2="180" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="490" y1="160" x2="490" y2="180" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="190" y1="310" x2="190" y2="330" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="490" y1="310" x2="490" y2="330" stroke="#6c7a99" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="60" y="588" fill="#9aa6c2" font-size="12">客服/退款/FAQ 等字样仅存在于 Plugin 包；Core 与适配层均业务无关。</text>
</svg>