<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="420" fill="#0f172a"/>
  <rect x="0" y="0" width="680" height="420" fill="none"/>

  <!-- title -->
  <text x="24" y="34" fill="#e2e8f0" font-size="18" font-weight="700">插件化落地 · 阶段依赖与关键路径</text>
  <text x="24" y="56" fill="#94a3b8" font-size="12">Phased Plan · 侵入面审计：core/server/webapp 零业务耦合</text>

  <!-- Phase 0 -->
  <rect x="24" y="92" width="180" height="78" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="40" y="118" fill="#38bdf8" font-size="13" font-weight="700">Phase 0</text>
  <text x="40" y="138" fill="#e2e8f0" font-size="12">Core 插件业务契约</text>
  <text x="40" y="156" fill="#94a3b8" font-size="11">context.ts / module.ts</text>

  <!-- Phase 1 -->
  <rect x="250" y="92" width="180" height="78" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="266" y="118" fill="#a78bfa" font-size="13" font-weight="700">Phase 1</text>
  <text x="266" y="138" fill="#e2e8f0" font-size="12">Server 扩展点</text>
  <text x="266" y="156" fill="#94a3b8" font-size="11">plugin-bootstrap / ext</text>

  <!-- Phase 2 -->
  <rect x="250" y="200" width="180" height="78" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="266" y="226" fill="#34d399" font-size="13" font-weight="700">Phase 2</text>
  <text x="266" y="246" fill="#e2e8f0" font-size="12">Webapp 扩展点</text>
  <text x="266" y="264" fill="#94a3b8" font-size="11">plugin-ui-registry</text>

  <!-- Phase 3 -->
  <rect x="476" y="146" width="180" height="78" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="492" y="172" fill="#fbbf24" font-size="13" font-weight="700">Phase 3</text>
  <text x="492" y="192" fill="#e2e8f0" font-size="12">客服插件包</text>
  <text x="492" y="210" fill="#94a3b8" font-size="11">plugins/customer-service</text>

  <!-- Phase 4 -->
  <rect x="476" y="254" width="180" height="78" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="492" y="280" fill="#f87171" font-size="13" font-weight="700">Phase 4</text>
  <text x="492" y="300" fill="#e2e8f0" font-size="12">生产加固</text>
  <text x="492" y="318" fill="#94a3b8" font-size="11">共享后端 / 热插拔</text>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M204 131 L248 131"/>
    <path d="M340 170 L340 198"/>
    <path d="M430 131 L474 173"/>
    <path d="M430 239 L474 197"/>
    <path d="M566 224 L566 252"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- parallel hint -->
  <rect x="250" y="300" width="180" height="22" rx="6" fill="#0b1220" stroke="#475569"/>
  <text x="262" y="315" fill="#cbd5e1" font-size="10">Phase 1 ∥ Phase 2 可并行</text>

  <!-- legend: business boundary -->
  <rect x="24" y="356" width="14" height="14" rx="3" fill="#fbbf24"/>
  <text x="44" y="368" fill="#cbd5e1" font-size="11">业务语义仅存在于插件包（Phase 3）</text>
  <rect x="24" y="378" width="14" height="14" rx="3" fill="#38bdf8"/>
  <text x="44" y="390" fill="#cbd5e1" font-size="11">平台原语 / 扩展点（无业务词）</text>
</svg>