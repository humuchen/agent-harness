  <rect x="58" y="696" width="156" height="64" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="136" y="718" text-anchor="middle">性能</text>
  <text class="ts" x="136" y="738" text-anchor="middle">p95 延迟 -30%</text>
  <text class="ts" x="136" y="754" text-anchor="middle">队列积压 &lt; 100</text>

  <rect x="222" y="696" width="156" height="64" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="300" y="718" text-anchor="middle">成本</text>
  <text class="ts" x="300" y="738" text-anchor="middle">长对话 token -50%</text>
  <text class="ts" x="300" y="754" text-anchor="middle">cache 命中率 &gt; 70%</text>

  <rect x="386" y="696" width="156" height="64" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="464" y="718" text-anchor="middle">质量</text>
  <text class="ts" x="464" y="738" text-anchor="middle">评估通过率 ≥ 90%</text>
  <text class="ts" x="464" y="754" text-anchor="middle">护栏误报率 &lt; 5%</text>

  <rect x="550" y="696" width="156" height="64" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="628" y="718" text-anchor="middle">可用性</text>
  <text class="ts" x="628" y="738" text-anchor="middle">SLA 99.9%</text>
  <text class="ts" x="628" y="754" text-anchor="middle">MTTR &lt; 15 分钟</text>

  <rect x="714" y="696" width="156" height="64" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="792" y="718" text-anchor="middle">工程效率</text>
  <text class="ts" x="792" y="738" text-anchor="middle">部署频率 ×2</text>
  <text class="ts" x="792" y="754" text-anchor="middle">核心测试 &lt; 5 分钟</text>
</g>

</svg>
