  <title>
    分层架构设计：接入层 / 前端应用层 / 后端工具层（结合 agent-harness）
  </title>
  <desc>
    以用户要求的三个新层为主线：前端应用层 → 接入层 →
    后端工具层，并挂接基座服务/执行后端/外部集成作为支撑底座。层间解耦、职责清晰、易扩展。
  </desc>
