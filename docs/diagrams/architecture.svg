<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="800" fill="#f8fafc"/>

  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">agent-harness 架构总览（pnpm monorepo）</text>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748b">单一可运行 TS Agent 框架 · 零硬运行时依赖 · 业务策略（鉴权/审批/评估）与核心解耦</text>

  <rect x="20" y="70" width="920" height="710" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="40" y="100" font-size="13" font-weight="700" fill="#0f172a">框架与服务端（左）</text>
  <text x="560" y="100" font-size="13" font-weight="700" fill="#0f172a">多端客户端（右）</text>

  <!-- LEFT: core -->
  <rect x="60" y="118" width="200" height="86" rx="10" fill="#2563eb"/>
  <text x="160" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">@agent-harness/core</text>
  <text x="160" y="166" text-anchor="middle" font-size="11" fill="#dbeafe">框架库 · 零运行时依赖</text>
  <text x="160" y="184" text-anchor="middle" font-size="10" fill="#bfdbfe">harness / tools / memory / guardrails / llm / integrations</text>

  <!-- LEFT: server -->
  <rect x="60" y="306" width="200" height="86" rx="10" fill="#7c3aed"/>
  <text x="160" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">@agent-harness/server</text>
  <text x="160" y="354" text-anchor="middle" font-size="11" fill="#ede9fe">Web Playground（node:http + SSE）</text>
  <text x="160" y="372" text-anchor="middle" font-size="10" fill="#ddd6fe">runner / mcp-manager / env-pipeline / 鉴权·审批·评估·留存</text>

  <!-- LEFT: examples -->
  <rect x="60" y="494" width="200" height="78" rx="10" fill="#475569"/>
  <text x="160" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">examples</text>
  <text x="160" y="542" text-anchor="middle" font-size="11" fill="#e2e8f0">10 个 CLI 示例</text>
  <text x="160" y="560" text-anchor="middle" font-size="10" fill="#cbd5e1">basic / chat / multi-mcp / verify-* …</text>

  <!-- RIGHT: webapp -->
  <rect x="560" y="118" width="200" height="86" rx="10" fill="#0d9488"/>
  <text x="660" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">@agent-harness/webapp</text>
  <text x="660" y="166" text-anchor="middle" font-size="11" fill="#ccfbf1">Lit + Vite SPA</text>
  <text x="660" y="184" text-anchor="middle" font-size="10" fill="#99f6e4">消费 client SDK（同源托管）</text>

  <!-- RIGHT: client -->
  <rect x="560" y="306" width="200" height="86" rx="10" fill="#d97706"/>
  <text x="660" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">@agent-harness/client</text>
  <text x="660" y="354" text-anchor="middle" font-size="11" fill="#fef3c7">零依赖 HTTP SDK</text>
  <text x="660" y="372" text-anchor="middle" font-size="10" fill="#fde68a">对 /api/v1（JSON + SSE）建模</text>

  <!-- RIGHT: cli -->
  <rect x="560" y="494" width="200" height="78" rx="10" fill="#e11d48"/>
  <text x="660" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">@agent-harness/cli</text>
  <text x="660" y="542" text-anchor="middle" font-size="11" fill="#ffe4e6">Node CLI `ah`</text>
  <text x="660" y="560" text-anchor="middle" font-size="10" fill="#fecdd3">基于 client SDK（运维 / CI）</text>

  <!-- dependency arrows -->
  <path d="M160,304 C160,254 160,254 160,204" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="172" y="260" font-size="10" fill="#334155">依赖</text>

  <path d="M82,494 C40,400 40,250 80,204" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="6" y="350" font-size="10" fill="#334155">依赖</text>

  <path d="M660,204 C660,254 660,254 660,304" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="672" y="260" font-size="10" fill="#334155">依赖</text>

  <path d="M660,494 C620,420 620,360 660,392" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="700" y="445" font-size="10" fill="#334155">依赖</text>

  <path d="M560,349 C460,349 360,349 260,349" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="392" y="341" font-size="10" fill="#334155">HTTP /api/v1</text>

  <!-- EXTERNAL INTEGRATIONS -->
  <text x="40" y="608" font-size="13" font-weight="700" fill="#0f172a">外部集成（core / server 依赖）</text>
  <text x="700" y="608" font-size="10" fill="#64748b">● 必须依赖　○ 可选依赖</text>

  <!-- badges -->
  <!-- 1 OpenRouter -->
  <rect x="40" y="624" width="120" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">OpenRouter</text>
  <text x="100" y="666" text-anchor="middle" font-size="10" fill="#166534">○ LLM（默认）</text>
  <!-- 2 OpenAI -->
  <rect x="168" y="624" width="120" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="228" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">OpenAI</text>
  <text x="228" y="666" text-anchor="middle" font-size="10" fill="#166534">○ LLM（failover）</text>
  <!-- 3 Harness.io -->
  <rect x="296" y="624" width="120" height="56" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="356" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">Harness.io</text>
  <text x="356" y="666" text-anchor="middle" font-size="10" fill="#6b21a8">○ 环境治理（dry-run）</text>
  <!-- 4 MCP -->
  <rect x="424" y="624" width="120" height="56" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="484" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">MCP 服务</text>
  <text x="484" y="666" text-anchor="middle" font-size="10" fill="#155e75">● SDK Context7…</text>
  <!-- 5 K8s -->
  <rect x="552" y="624" width="120" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="612" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Kubernetes</text>
  <text x="612" y="666" text-anchor="middle" font-size="10" fill="#1e40af">○ env 后端</text>
  <!-- 6 OTel -->
  <rect x="680" y="624" width="120" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">OpenTelemetry</text>
  <text x="740" y="666" text-anchor="middle" font-size="10" fill="#991b1b">○ 追踪（降级）</text>
  <!-- 7 Redis -->
  <rect x="808" y="624" width="120" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="868" y="648" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Redis</text>
  <text x="868" y="666" text-anchor="middle" font-size="10" fill="#991b1b">○ 运行队列(server)</text>

  <text x="40" y="706" font-size="11" fill="#475569">①②③④⑤⑥ 接入 <tspan font-weight="700" fill="#2563eb">core</tspan>　·　⑦ 接入 <tspan font-weight="700" fill="#7c3aed">server</tspan>（运行队列后端，多副本水平扩展）</text>
  <text x="40" y="726" font-size="10" fill="#94a3b8">构建顺序（pnpm -r build 按拓扑）：core → client → server → webapp / cli → examples。跨包 tsconfig paths 指向兄弟包 dist/index.d.ts。</text>
</svg>
