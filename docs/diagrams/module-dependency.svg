  <rect x="40" y="320" width="200" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="5,3"/>
  <text x="140" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">guardrails.ts</text>
  <text x="140" y="362" text-anchor="middle" font-size="10" fill="#64748b">leaf · 三层护栏 + PII</text>

  <rect x="260" y="320" width="200" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="5,3"/>
  <text x="360" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">telemetry.ts</text>
  <text x="360" y="362" text-anchor="middle" font-size="10" fill="#64748b">leaf · OTel 可选降级</text>

  <rect x="480" y="320" width="200" height="54" rx="8" fill="#0d9488"/>
  <text x="580" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">skills/*</text>
  <text x="580" y="362" text-anchor="middle" font-size="10" fill="#ccfbf1">SkillRegistry + use_skill</text>

  <rect x="700" y="320" width="100" height="54" rx="8" fill="#0d9488"/>
  <text x="750" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">integrations/*</text>
  <text x="750" y="362" text-anchor="middle" font-size="9" fill="#ccfbf1">harness/mcp/k8s</text>

