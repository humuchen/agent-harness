  <path d="M410,102 L410,120" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ah3)"/>
  <path d="M360,174 L240,210" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <path d="M410,174 L360,210" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <path d="M460,174 L490,210" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
