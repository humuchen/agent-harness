  <text x="140" y="459" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">memory-store.ts（leaf）</text>

  <rect x="300" y="430" width="220" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5,3"/>
  <text x="410" y="459" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">types.ts（leaf · 契约基座）</text>

  <rect x="700" y="430" width="100" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5,3"/>
  <text x="750" y="459" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">env-platform.types</text>

