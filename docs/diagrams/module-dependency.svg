<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="600" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">模块依赖图</text>
  <text x="410" y="50" text-anchor="middle" font-size="12" fill="#64748b">@agent-harness/core 内部模块（分组）+ 包级依赖</text>

  <!-- index barrel -->
  <rect x="250" y="64" width="320" height="38" rx="8" fill="#0f172a"/>
  <text x="410" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">index.ts（barrel：统一导出 public API）</text>

  <!-- harness -->
  <rect x="300" y="120" width="220" height="54" rx="8" fill="#7c3aed"/>
  <text x="410" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">harness.ts</text>
  <text x="410" y="162" text-anchor="middle" font-size="10" fill="#ede9fe">AgentHarness + run() 编排循环</text>

  <!-- Row 2 -->
  <rect x="40" y="210" width="200" height="60" rx="8" fill="#2563eb"/>
  <text x="140" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">tools.ts</text>
  <text x="140" y="252" text-anchor="middle" font-size="10" fill="#dbeafe">ToolRegistry</text>
  <text x="140" y="266" text-anchor="middle" font-size="9" fill="#bfdbfe">schemas / call / mergeFrom</text>

  <rect x="260" y="210" width="200" height="60" rx="8" fill="#2563eb"/>
  <text x="360" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">memory.ts</text>
  <text x="360" y="252" text-anchor="middle" font-size="10" fill="#dbeafe">Memory（窗口+长期+摘要）</text>
  <text x="360" y="266" text-anchor="middle" font-size="9" fill="#bfdbfe">系统提示注入 / load·save</text>

  <rect x="480" y="210" width="200" height="60" rx="8" fill="#2563eb"/>
  <text x="580" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">llm/*</text>
  <text x="580" y="252" text-anchor="middle" font-size="10" fill="#dbeafe">openrouter / openai</text>
  <text x="580" y="266" text-anchor="middle" font-size="9" fill="#bfdbfe">shared / failover / pricing</text>

  <rect x="700" y="210" width="100" height="60" rx="8" fill="#0d9488"/>
  <text x="750" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">builtins/*</text>
  <text x="750" y="254" text-anchor="middle" font-size="9" fill="#ccfbf1">fs/web/calc/dt/shell</text>

