  <!-- <path d="M410,174 L580,210" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/> -->
  <!-- tools -> types -->
  <path d="M140,270 L300,430" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <!-- memory -> types, memory-store -->
  <path d="M330,270 L360,430" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <path d="M300,270 L140,430" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <!-- llm -> types, telemetry(failover) -->
  <path d="M540,270 L430,430" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <path d="M540,270 L360,320" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#ah3)"/>
  <!-- builtins/skills/integrations -> tools -->
  <path d="M730,270 L240,300" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <path d="M560,320 L240,300" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <path d="M730,320 L240,300" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>
  <!-- integrations -> telemetry, env-types -->
  <path d="M730,320 L360,320" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#ah3)"/>
  <path d="M750,374 L750,430" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#ah3)"/>

  <!-- legend -->
  <text x="40" y="520" font-size="11" font-weight="700" fill="#0f172a">图例</text>
  <line x1="40" y1="538" x2="90" y2="538" stroke="#334155" stroke-width="2"/><text x="98" y="542" font-size="10" fill="#475569">模块依赖（uses）</text>
  <line x1="240" y1="538" x2="290" y2="538" stroke="#16a34a" stroke-width="2"/><text x="298" y="542" font-size="10" fill="#475569">→ types（契约基座）</text>
  <line x1="470" y1="538" x2="520" y2="538" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/><text x="528" y="542" font-size="10" fill="#475569">→ 可选外部（OTel 等）</text>

  <!-- package-level note -->
  <rect x="40" y="556" width="740" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="581" font-size="11" fill="#334155">包级依赖：server → core　·　webapp → client → server(/api/v1)　·　cli → client　·　examples → core　|　构建顺序 core → client → server → webapp/cli → examples</text>
