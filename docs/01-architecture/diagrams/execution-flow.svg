<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1180" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="1180" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">AgentHarness.run() 执行流</text>
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#64748b">backend/core/src/harness.ts — 编排循环（LLM ↔ 工具 ↔ 记忆）+ 事件流 onEvent / 可观测</text>

  <!-- center x = 410 -->
  <!-- START -->
  <rect x="330" y="72" width="160" height="40" rx="20" fill="#0f172a"/>
  <text x="410" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">run(userInput)</text>

  <!-- setup -->
  <rect x="280" y="130" width="260" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="410" y="157" text-anchor="middle" font-size="12" fill="#1e293b">建立 runId · emit · AbortController</text>

  <!-- timeout/abort wiring -->
  <rect x="280" y="190" width="260" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="410" y="217" text-anchor="middle" font-size="12" fill="#1e293b">外部 signal + timeoutMs 组合 → abortedFlag</text>

  <!-- input guardrail -->
  <rect x="280" y="250" width="260" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="410" y="277" text-anchor="middle" font-size="12" fill="#854d0e">输入护栏 checkInput（密钥/注入/长度）</text>

  <!-- decision blocked? -->
  <polygon points="410,310 470,338 410,366 350,338" fill="#fee2e2" stroke="#dc2626"/>
  <text x="410" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">拦截?</text>

  <!-- blocked branch -->
  <path d="M470,338 C540,338 560,430 560,470" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
  <rect x="495" y="468" width="170" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="580" y="495" text-anchor="middle" font-size="11" fill="#991b1b">emit guardrail:blocked</text>
  <text x="580" y="510" text-anchor="middle" font-size="10" fill="#991b1b">return [blocked]</text>

  <!-- load memory -->
  <rect x="280" y="382" width="260" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="410" y="409" text-anchor="middle" font-size="12" fill="#075985">加载记忆 memory.load()（持久化时）</text>

  <!-- inject system -->
  <rect x="280" y="442" width="260" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="410" y="469" text-anchor="middle" font-size="12" fill="#075985">注入系统提示词 + user 消息（memory.add）</text>

  <!-- LOOP box -->
  <rect x="250" y="506" width="320" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="410" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">for step &lt; maxSteps（默认 24）</text>

  <!-- budget check -->
  <rect x="280" y="572" width="260" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="410" y="597" text-anchor="middle" font-size="12" fill="#1e293b">预算检查 token / cost</text>

  <!-- llm call -->
  <rect x="280" y="628" width="260" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="410" y="652" text-anchor="middle" font-size="12" fill="#1e40af">LLM 调用（withSpan + Promise.race）</text>
  <text x="410" y="668" text-anchor="middle" font-size="10" fill="#1e40af">传递 signal，可被取消</text>

  <!-- accounting -->
  <rect x="280" y="688" width="260" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="410" y="713" text-anchor="middle" font-size="11" fill="#1e293b">记账 token/cost（estimateCost）+ 重查预算</text>

  <!-- output guardrail -->
  <rect x="280" y="744" width="260" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="410" y="769" text-anchor="middle" font-size="11" fill="#854d0e">输出护栏 checkOutput</text>

  <!-- decision tool_calls? -->
  <polygon points="410,792 470,820 410,848 350,820" fill="#dcfce7" stroke="#16a34a"/>
  <text x="410" y="825" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">有 tool_calls?</text>

  <!-- final answer branch -->
  <path d="M350,820 C270,820 250,900 250,950" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
  <text x="180" y="815" font-size="10" fill="#166534">否</text>
  <rect x="120" y="948" width="200" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="220" y="975" text-anchor="middle" font-size="11" fill="#166534">返回 final answer</text>

  <!-- tool branch -->
  <path d="M470,820 C560,820 560,860 560,892" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
  <text x="540" y="815" font-size="10" fill="#166534">是</text>

  <!-- tool arg guardrail -->
  <rect x="470" y="890" width="240" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="590" y="917" text-anchor="middle" font-size="11" fill="#854d0e">工具参数护栏 checkToolArgs</text>

  <!-- decision arg blocked? -->
  <polygon points="590,944 640,968 590,992 540,968" fill="#fee2e2" stroke="#dc2626"/>
  <text x="590" y="973" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">拦截?</text>

  <!-- arg blocked -> result -->
  <path d="M640,968 C700,968 720,1010 720,1040" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
  <rect x="650" y="1038" width="170" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="735" y="1063" text-anchor="middle" font-size="10" fill="#991b1b">result = 护栏拦截文本</text>

  <!-- execute tool -->
  <path d="M540,968 C500,968 480,1010 480,1040" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
  <rect x="420" y="1038" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="520" y="1063" text-anchor="middle" font-size="11" fill="#1e40af">执行 tool.call（withSpan）</text>
  <text x="520" y="1078" text-anchor="middle" font-size="10" fill="#1e40af">错误→回灌 result 自愈</text>

  <!-- memory.add tool result -->
  <rect x="300" y="1100" width="320" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="460" y="1125" text-anchor="middle" font-size="11" fill="#075985">截断 + memory.add(tool) → 回到循环顶部</text>

  <!-- loop-back arrow -->
  <path d="M300,1120 C200,1120 180,560 250,556" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ah2)"/>

  <!-- exit path to finalize -->
  <path d="M120,992 C90,1010 90,1070 110,1110" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#ah2)"/>
  <text x="40" y="1040" font-size="10" fill="#0f172a">退出循环</text>

  <!-- finalize -->
  <rect x="60" y="1110" width="200" height="44" rx="8" fill="#0f172a"/>
  <text x="160" y="1137" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">持久化 save + 输出 PII 脱敏</text>

  <!-- run:end -->
  <rect x="60" y="1166" width="200" height="0" />
</svg>
