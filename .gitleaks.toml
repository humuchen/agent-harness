# gitleaks 基线配置 —— P2 CI secret 扫描。
#
# 目标：
#   - 默认 gitleaks 规则（AWS / GitHub / OpenAI / 通用 api_key / 私钥等）保持全量启用；
#   - 显式排除仓库内已知的「非 secret」字段，避免历史误报阻断门禁。
#
# 维护约定：
#   1) 新增误报项先加进这里的 `paths` / `regexes`，并注释原因；
#   2) 若某项确为真实泄露，立即在 git 历史里 `git filter-repo` 清除并轮换凭证，
#      而不是把它加进忽略名单；
#   3) 每季度 review 一次本文件，删除已不存在的占位。

title = "gitleaks config for agent-harness"

[extend]
# 继承 gitleaks 默认规则集（包含 80+ 条常见 secret 模式）
default = true

# 跳过 .env.example / 文档 / 测试 fixture（占位与示例值，非真实密钥）
[allowlist]
description = "已知非 secret 字段与占位示例"
paths = [
  '''\.env\.example$''',
  '''CHANGELOG\.md$''',
  '''docs/.*''',
  '''assets/.*''',
  '''public/.*''',
  # 测试 fixture / mock 数据（只含占位，不含真实凭证）
  '''test/.*\.cjs$''',
  # K8s 示例（secret.yaml.example 明确标注占位）
  '''deploy/k8s/regcred\.yaml\.example$''',
  '''deploy/k8s/secret\.yaml\.example$''',
  # Docker 构建产物 / lockfile
  '''pnpm-lock\.yaml$''',
]

# 仓库内明确声明的占位 / 示例值
regexes = [
  # secret.yaml.example 里的占位（已用 0 填充）
  { description = "placeholder 0-token", regex = '''eyJ[A-Z0-9_-]{4,16}={0,2}''' }
  # OPEN_API_KEY=sk-or-... 占位
  { description = "openrouter placeholder", regex = '''sk-or-\.\.\.''' }
  # 测试 fixture 里的 mock key
  { description = "test fixture mock key", regex = '''test-admin-token''' }
  { description = "test fixture mock key2", regex = '''sk-test-\w+''' }
]
