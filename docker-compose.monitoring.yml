# ──────────────────────────────────────────────
# 监控栈 overlay（Prometheus + Grafana + Alertmanager）
#
# 用法：
#   GRAFANA_ADMIN_PASSWORD=<强口令> docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile monitoring up -d
#
# 访问：
#   Grafana        http://localhost:3000   （口令经 GRAFANA_ADMIN_PASSWORD 注入，未设置则拒绝启动）
#   Prometheus     http://localhost:9090
#   Alertmanager   http://localhost:9093
#
# 说明：
#   - 端口只绑定 127.0.0.1（本机访问）：Prometheus 的 lifecycle API 曾未鉴权暴露，
#     任何能访问 9090 的来源都可 POST /-/quit 关停服务；Grafana 亦不应裸奔公网。
#     远端访问请走反向代理 + 认证，或 k8s ServiceMonitor 方案。
#   - 抓取目标为 compose 网络内的 `ui:4173`，指标端点 /api/metrics/prometheus（无需令牌）。
#   - Grafana 数据源与看板经 provisioning 自动装配（无需手工导入）。
#   - 告警链路：Prometheus 规则 → Alertmanager（分组/抑制）→ ALERTMANAGER_WEBHOOK_URL。
#     未配置 webhook 时告警仅在 Alertmanager UI 可见（不对外投递）。
#   - K8s 部署请改用 deploy/k8s/ 下的 ServiceMonitor / Prometheus Operator 方案，或直接抓取 Service DNS。
# ──────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ['monitoring']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      # 安全加固：移除 --web.enable-lifecycle（未鉴权的 /-/reload、/-/quit 可被任意来源调用）。
      # 需要热加载配置时：docker compose kill -s SIGHUP prometheus
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ['monitoring']
    restart: unless-stopped
    # --config.expand-env=true：允许配置里用 ${VAR} 引用环境变量（0.22+ 特性）。
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--config.expand-env=true'
    environment:
      # 告警投递地址（飞书/钉钉/企业微信群机器人 Webhook 或自研网关）。
      # 未配置时指向 discard 端口（告警仅在 Alertmanager UI 可见，不对外投递）。
      ALERTMANAGER_WEBHOOK_URL: '${ALERTMANAGER_WEBHOOK_URL:-http://127.0.0.1:9/noop}'
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9093/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ['monitoring']
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # 安全加固：管理口令必须显式提供（fail-fast），杜绝默认 admin/admin 上线。
      # 本地开发可在 .env 写 GRAFANA_ADMIN_PASSWORD=admin 明示接受弱口令。
      GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:?请在环境变量或 .env 中设置 GRAFANA_ADMIN_PASSWORD（生产禁止默认口令）}'
      # 关闭匿名访问；看板以 provisioning 只读装配。
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ALERTING_ENABLED: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── P2 日志管线：Loki（存储）+ promtail（采集）───────────────────────────
  # structLog 的 JSON 行日志被 promtail 解析为 level / trace.id 标签，
  # 在 Grafana Explore 里可按 {service="ui", level="error"} 直接过滤，并可从
  # 指标异常一键跳到对应时间窗的日志（trace.id 关联）。
  loki:
    image: grafana/loki:3.1.0
    profiles: ['monitoring']
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    # 端口不对宿主机暴露：仅 compose 网络内被 Grafana / promtail 访问。
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:3100/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  promtail:
    image: grafana/promtail:3.1.0
    profiles: ['monitoring']
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - ./deploy/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      # 采集 docker 容器日志：json-file 目录 + docker.sock（用于 docker_sd 与元数据标签）。
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
