# GitHub Actions — 测试 + 构建 + 部署到 Render
#
# 触发：
#   - push 到 dev 分支：部署到 Render
#   - push 到 main 分支：部署到 Render
#   - pull_request 到 dev/main 分支：PR 门禁，必须全绿才能合并
#
# 【供应链待办（P1#33）：pin actions 到 commit SHA】
# 本文件与 docker.yml 的所有 uses: 仍引用主版本 tag（@v4/@v5 等）。2026-10-26 的
# 收尾尝试因构建环境无外网（GitHub API 不可达）未能取得精确 SHA——凭记忆写入
# 错误 SHA 会直接挂 CI，风险不对称，故保留 tag 引用并留此待办。
# 执行方法（有网环境，逐个验证）：
#   for repo in "actions/checkout v4" "actions/setup-node v4" "pnpm/action-setup v4" \
#               "actions/dependency-review-action v4" "gitleaks/gitleaks-action v2" \
#               "docker/metadata-action v5" "docker/login-action v3" \
#               "docker/setup-buildx-action v3" "docker/build-push-action v6"; do
#     set -- $repo
#     curl -s "https://api.github.com/repos/$1/commits/$2" | grep -m1 '"sha"'
#   done
# 把每个 uses: 改为 `owner/repo@<sha> # v4` 格式（注释保留版本号便于升级）。
#
# 需要的 Secrets：
#   RENDER_DEPLOY_HOOK_URL — 从 Render Dashboard → Settings → Deploy Hook 获取
#   TURSO_URL              — （可选）Turso 数据库地址
#   TURSO_TOKEN            — （可选）Turso 访问令牌
#
name: CI/CD

on:
  push:
    branches: [main, dev, master]
  pull_request:
    branches: [main, dev, master]
  # 夜间回滚演练触发器（schedule / 手动 dispatch）必须挂在 workflow 级 `on:` 下——
  # 此前被错误缩进到 jobs.nightly 内，导致整个 workflow 文件解析失败、CI 全部不可用。
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  test:
    name: 测试 + 构建 + 安全审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: k8s 多副本组合校验（R3）
        run: node scripts/validate-k8s-combo.cjs
      # P0-A：强制产出 OS 级沙箱原生 helper（与 Dockerfile 的 HARNESS_NATIVE_STRICT=1 对齐），
      # 并校验产物存在 —— 防止 CI 上跑测试时静默降级到「硬化本地执行器」。
      - name: 构建 OS 级沙箱 helper（严格模式）
        run: |
          apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config libseccomp-dev libcap-dev
          HARNESS_NATIVE_STRICT=1 bash scripts/build-native.sh
          test -x backend/core/native/sandbox-exec/build/sandbox-exec

      - name: 代码检查（ESLint，fail on error）
        run: pnpm lint

      # P2：no-explicit-any 棘轮——存量锁定（.eslint-any-baseline.json），禁止新增 any。
      # 存量清零后把 eslint.config.js 的 no-explicit-any 提为 error 并删除此步。
      - name: no-explicit-any 棘轮检查
        run: node scripts/lint-any-ratchet.cjs

      - name: 构建
        run: pnpm -r build

      # P1 补齐：typecheck 门禁——webapp 的 build 走 vite build（esbuild 仅转译不查类型），
      # svelte-check / tsc --noEmit 此前从未在 CI 执行，类型错误可直达 main。
      # 无 typecheck script 的包静默跳过（--if-present）。
      - name: 类型检查（tsc --noEmit / svelte-check，--if-present）
        run: pnpm -r --if-present typecheck

      - name: 测试
        run: pnpm -r test

      - name: 依赖安全审计（pnpm audit）
        run: pnpm audit --audit-level=high

      - name: 留存清理测试（dry-run）
        run: node scripts/cleanup-retention.cjs --dry-run

      - name: 备份脚本验证
        run: node scripts/backup-db.cjs --action backup && node scripts/backup-db.cjs --action list

      # P2：CI 安全基线 —— secret 扫描 + SBOM + 回滚演练（verify-only，快速）。
      # 完整回滚链路（backup → verify → restore）放在 nightly job，避免拖慢 PR 门禁。
      # gitleaks 基线在仓库根 .gitleaks.toml：继承默认规则 + 排除占位/示例，
      # 避免历史误报阻断门禁。真实泄露走 git filter-repo 清除并轮换凭证，不进 allowlist。
      - name: secret 扫描（gitleaks，基线 .gitleaks.toml）
        uses: gitleaks/gitleaks-action@v2
        with:
          workdir: ./
          config: .gitleaks.toml

      - name: 生成 SBOM（Syft）
        run: |
          docker run --rm -v "$(pwd):/scan" -w /scan aquasec/syft:latest /scan --file sbom.spdx.json -q
          test -s sbom.spdx.json

      - name: 回滚演练（verify-only，快速）
        run: node scripts/rollback-drill.cjs --action verify

  # P2-8 补齐：PR 依赖安全审查（Dependency Review）——PR 引入的传递依赖若存在
  # 已知高危漏洞或许可证不合规，门禁直接失败（此前仅靠 pnpm audit 覆盖锁文件全量）。
  dependency-review:
    name: 依赖安全审查（PR）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # 许可证拒绝清单可按需追加（GPL-3.0 等强传染协议）
          deny-licenses: AGPL-3.0-or-later

  # P2：E2E 冒烟——启动真实服务进程（mock 模式，零外部依赖）跑 SSE 重连脚本，
  # 把此前游离在 CI 外的 e2e 脚本纳入门禁。deploy 依赖本 job 全绿。
  e2e:
    name: E2E 冒烟（真实进程 + SSE）
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm -r build

      - name: 启动服务（后台，mock 模式）
        run: |
          ADMIN_API_KEY=test-admin-token node access/server/dist/server.js > /tmp/server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/health/ready > /dev/null; then
              echo "服务已就绪（第 ${i} 次探测）"; exit 0
            fi
            sleep 1
          done
          echo "服务 30s 内未就绪，日志："; tail -50 /tmp/server.log; exit 1

      - name: SSE 重连 E2E
        run: node scripts/sse-reconnect-test.cjs
        env:
          SERVER_URL: http://127.0.0.1:4173

      # P2 演练入 CI：HTTP 负载与容量基线此前完全游离在 CI 外。小参数跑通链路，
      # 断言请求零失败即可（性能阈值由容量基准观察，不作 PR 门禁）。
      - name: HTTP 负载测试（小规模门禁：请求零失败）
        run: node scripts/load-test.cjs
        env:
          SERVER_URL: http://127.0.0.1:4173
          ADMIN_TOKEN: test-admin-token
          CONCURRENCY: '10'
          REQUESTS: '100'

      # 容量基线依赖 runner 性能，共享 CI runner 波动大：仅采集输出，不判阈值防门禁抖动。
      - name: 容量基准（采集模式，不作门禁）
        run: node scripts/capacity-benchmark.cjs
        env:
          SERVER_URL: http://127.0.0.1:4173
          ADMIN_TOKEN: test-admin-token
          CONCURRENCY: '10'
          REQUESTS: '100'
        continue-on-error: true

      - name: 失败时输出服务日志
        if: failure()
        run: tail -100 /tmp/server.log

  deploy:
    name: 部署
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}

  # P2：夜间全量回滚演练（backup → verify → restore）—— 不阻塞 PR 门禁，
  # 每天 03:00 UTC 跑一次；也可在 Actions 页面手动 dispatch。
  # 触发器 schedule/workflow_dispatch 在 workflow 级 on: 下（修复了此前缩进错误
  # 导致整个 workflow 无法解析的问题）；job 级用 if 过滤事件类型。
  nightly:
    name: 夜间回滚演练（全链路）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 回滚演练（backup → verify → restore 全链路）
        run: |
          node scripts/rollback-drill.cjs --action backup
          node scripts/rollback-drill.cjs --action verify
          node scripts/rollback-drill.cjs --action restore --from latest
