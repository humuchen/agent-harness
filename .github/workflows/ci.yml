# GitHub Actions — 测试 + 构建 + 部署到 Fly.io
#
# 触发：
#   - push 到 dev 分支：构建并部署到 Fly（预览环境）
#   - push 到 main 分支：构建并部署到 Fly（生产环境）
#
# 需要的 Secrets：
#   FLY_API_TOKEN — 从 https://fly.io/user/personal_access_tokens 生成
#   TURSO_URL     — （可选）Turso 数据库地址
#   TURSO_TOKEN   — （可选）Turso 访问令牌

name: CI/CD

on:
  push:
    branches: [main, dev]

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm -r build

      - name: 测试
        run: pnpm -r test

  deploy:
    name: 部署
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 部署到 Fly.io
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            fly deploy --remote-only --app agent-harness
          else
            fly deploy --remote-only --app agent-harness-dev
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Turso 配置（可选）
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
