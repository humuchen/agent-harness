# Fly.io 部署配置 — agent-harness
#
# 部署步骤：
#   1. fly auth login
#   2. fly create agent-harness（首次）
#   3. fly volumes create agent_harness_data --size 1（挂载持久卷）
#   4. fly secrets set TURSO_URL=libsql://xxx TURSO_TOKEN=eyJ...（可选，启用 Turso）
#   5. fly deploy
#
# 数据库后端：
#   - 默认：本地 SQLite（零配置，数据落 /app/data，重启不丢）
#   - Turso：设 TURSO_URL + TURSO_TOKEN 后自动切换，失败自动回退本地

app = "agent-harness"
primary_region = "sjc"  # 硅谷；可选 nrt(东京) / sin(新加坡) / hkg(香港)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  UI_HOST = "0.0.0.0"
  # 默认本地 SQLite（兜底方案）
  DB_BACKEND = "sqlite"
  # 记忆后端：file（持久卷）/ sqlite / volatile
  MEMORY_BACKEND = "file"
  MEMORY_DIR = "/app/data/memory"
  # 医美插件数据目录
  MA_DATA_DIR = "/app/data/ma-lead"
  # 账户库
  ACCOUNT_DB_FILE = "/app/data/accounts.db"
  # 部署逃生账户
  ADMIN_USERNAME = "admin"
  ADMIN_PASSWORD = "admin888"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/state"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "agent_harness_data"
  destination = "/app/data"
