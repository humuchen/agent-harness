# Render Blueprint for agent-harness (pnpm monorepo)
#
# How to deploy:
#   1. Push this repo to GitHub (branch: dev).
#   2. In Render Dashboard → "New" → "Blueprint" → connect the repo → pick render.yaml.
#   3. Select the branch you want to deploy from (dev).
#
# Notes:
#   - This is a pnpm workspace: packages/core (framework) + packages/ui (web playground).
#   - dist/ is gitignored, so Render builds each package via `pnpm -r build`.
#   - The SSE dashboard binds 0.0.0.0:$PORT (Render injects PORT automatically).
#   - Free plan spins the service down after 15 min of inactivity (cold start on next visit).

services:
  - type: web
    name: agent-harness
    runtime: node
    nodeVersion: "22"        # pin Node 22 (engines: 22.x); Render installs the latest 22.x
    plan: free
    region: oregon            # oregon | frankfurt | singapore | ohio | virginia
    # IMPORTANT: this is a pnpm monorepo. The build MUST run `pnpm -r build` so each
    # workspace package (packages/core, packages/ui, examples) emits its dist/.
    # Do NOT use a bare `pnpm install` or point start at `dist/src/index.js` — those
    # belong to the old single-package layout and will fail with MODULE_NOT_FOUND.
    # 注意：显式 --no-frozen-lockfile 是为了自愈——CI 环境(pnpm 检测到 CI=true)默认会
    # 强制 --frozen-lockfile，一旦有人提交新依赖却忘记同步 pnpm-lock.yaml，构建即 exit 1。
    # 用 --no-frozen-lockfile 让 Render 在 lockfile 轻微漂移时自动校正，避免部署卡死。
    # 平时仍应保持 pnpm-lock.yaml 与 package.json 同步（本地改完依赖跑一次 pnpm install）。
    buildCommand: pnpm install --no-frozen-lockfile && pnpm -r build
    startCommand: node packages/ui/dist/server.js
    healthCheckPath: /api/state
    envVars:
      - key: NODE_ENV
        value: production
      - key: UI_HOST
        value: 0.0.0.0
      # Real LLM mode — fill in the dashboard to enable (otherwise Mock mode is used).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      # Context7 MCP docs integration (works without a key).
      - key: MCP_SERVER_URL
        value: https://mcp.context7.com/mcp
